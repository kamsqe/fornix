name: Build Matrix

on:
  push:
    branches: [main, master]
    paths: ['packages/**']
  pull_request:
    paths: ['packages/**']

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-combos:
    name: "Build: ${{ matrix.combo.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        combo:
          - name: recipe-saas
            flags: "--recipe saas"
          - name: recipe-agency
            flags: "--recipe agency"
          - name: recipe-docs
            flags: "--recipe docs"
          - name: recipe-blog
            flags: "--recipe blog"
          - name: recipe-portfolio
            flags: "--recipe portfolio"
          - name: single-hero
            flags: "--blocks hero-gradient --render static --deploy static"
          - name: multi-sections
            flags: "--blocks hero-gradient,pricing-table,faq-accordion,footer-rich --render static --deploy cloudflare"
          - name: auth-flow
            flags: "--render server --deploy cloudflare --blocks auth-better-auth"
          - name: server-vercel
            flags: "--render server --deploy vercel --blocks hero-gradient"
          - name: i18n-multi
            flags: "--blocks hero-gradient --locales en,es --render static --deploy static"
          - name: theme-switcher
            flags: "--blocks hero-gradient --palette midnight --theme-switcher --render static --deploy static"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter create-fornix build

      - name: Scaffold project
        run: |
          node packages/create-fornix/dist/index.js create \
            /tmp/${{ matrix.combo.name }} \
            ${{ matrix.combo.flags }} \
            --yes --no-git --no-install

      - name: Install project deps
        run: cd /tmp/${{ matrix.combo.name }} && pnpm install --no-frozen-lockfile
        timeout-minutes: 5

      - name: Astro check
        run: cd /tmp/${{ matrix.combo.name }} && npx astro check
        continue-on-error: true

      - name: Astro build
        run: cd /tmp/${{ matrix.combo.name }} && npx astro build
        timeout-minutes: 5

  add-remove-lifecycle:
    name: "Add/Remove Lifecycle"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter create-fornix build

      - name: Create base project
        run: |
          node packages/create-fornix/dist/index.js create \
            /tmp/lifecycle-test \
            --blocks hero-gradient,pricing-table \
            --render static --deploy static \
            --yes --no-git --no-install

      - name: Install project deps
        run: cd /tmp/lifecycle-test && pnpm install --no-frozen-lockfile

      - name: Build (baseline)
        run: cd /tmp/lifecycle-test && npx astro build

      - name: Add block
        run: |
          cd /tmp/lifecycle-test && \
          node $GITHUB_WORKSPACE/packages/create-fornix/dist/index.js add faq-accordion

      - name: Build (after add)
        run: cd /tmp/lifecycle-test && npx astro build

      - name: Remove block
        run: |
          cd /tmp/lifecycle-test && \
          node $GITHUB_WORKSPACE/packages/create-fornix/dist/index.js remove pricing-table

      - name: Build (after remove)
        run: cd /tmp/lifecycle-test && npx astro build
